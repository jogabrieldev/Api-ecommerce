spring:
  application:
    name: e-commerce
  datasource:
    url: ${URL-source}
    username: ${username}
    password: ${password}
    driver-class-name: ${diver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8080

external:
  api:
    fake-store:
      base-url: ${FAKE_STORE_BASE_URL:https://fakestoreapi.com}
      connect-timeout: ${FAKE_STORE_CONNECT_TIMEOUT:3s}
      read-timeout: ${FAKE_STORE_READ_TIMEOUT:10s}

security:
  jwt:
    secret: ${jwt_secret}
    expiration-seconds: 3600

logging:
  level:
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([${spring.application.name}]){green} %clr(%logger{36}){cyan} - %msg%n"
