spring.application.name=e-commerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=ecommerce_user
spring.datasource.password=101010

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

security.jwt.secret=${JWT_SECRET:ecommerce-local-jwt-secret-change-in-production-2026}
security.jwt.expiration-seconds=3600
